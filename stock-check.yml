name: Stock averaging check

on:
  schedule:
    # 10:05 UTC = 15:35 IST, shortly after NSE market close, Mon-Fri
    - cron: "5 10 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - run: python analyze_stock.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update stock data"
          file_pattern: docs/data.json
